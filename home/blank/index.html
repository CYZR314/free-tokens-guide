<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>占位页 · 我的收藏夹</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f6f7f9; --bg-elev: #ffffff; --bg-soft: #f0f2f5;
    --ink: #14161c; --ink-2: #4a5160; --ink-3: #8a91a0;
    --line: #e5e7ec; --accent: #2b4bf2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0f14; --bg-elev: #161922; --bg-soft: #1b1f29;
      --ink: #eef1f6; --ink-2: #b6bcc9; --ink-3: #7f8798;
      --line: #262b35; --accent: #7c8cff;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); display: grid; place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px; line-height: 1.7; padding: 32px;
  }
  .box { max-width: 460px; text-align: center; }
  .cover {
    width: 100%; border-radius: 16px; overflow: hidden; border: 1px solid var(--line);
    background: var(--bg-soft); margin-bottom: 26px;
  }
  .cover img { display: block; width: 100%; height: auto; aspect-ratio: 640 / 400; object-fit: cover; }
  .tag {
    display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px;
    border-radius: 999px; font-size: 11.5px; font-weight: 600;
    background: var(--bg-soft); color: var(--ink-3); margin-bottom: 12px;
  }
  h1 { margin: 0 0 8px; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  p { margin: 0 0 6px; color: var(--ink-2); font-size: 14px; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--bg-soft); padding: 1px 6px; border-radius: 5px; font-size: 13px;
  }
  .back {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 26px;
    height: 38px; padding: 0 18px; border-radius: 999px; text-decoration: none;
    color: #fff; background: var(--accent); font-size: 13.5px; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="cover"><img id="cover" alt="" onerror="this.remove()"></div>
    <div class="tag">待建设</div>
    <h1 id="title">占位页</h1>
    <p id="desc">这个入口还没想好放什么。</p>
    <p>想好之后，把 <code>data.json</code> 里这一条的 <code>href</code> 改成新页面地址即可。</p>
    <a class="back" href="../index.html">← 返回首页</a>
  </div>

<script>
(function () {
  var slot = new URLSearchParams(location.search).get("slot");
  document.title = "占位页 · 我的收藏夹";
  if (!slot) return;
  fetch("../data.json", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var it = (d.entries || []).filter(function (e) { return e.id === slot; })[0];
      if (!it) return;
      document.title = it.title + " · 占位页";
      document.getElementById("title").textContent = it.title;
      if (it.desc) document.getElementById("desc").textContent = it.desc;
      var c = document.getElementById("cover");
      if (it.image) c.src = "../" + it.image;
      c.alt = it.title;
    })
    .catch(function () {});
})();
</script>
</body>
</html>
