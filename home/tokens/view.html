<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>免费 Tokens 白嫖攻略 · 我的收藏夹</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #ffffff;
    --ink: #14161c;
    --ink-2: #6b7280;
    --line: #e5e7ec;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161c; --ink: #eef1f6; --ink-2: #9aa2b1; --line: #262b35; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
  }
  .bar {
    flex: 0 0 auto; height: 44px; display: flex; align-items: center; gap: 12px;
    padding: 0 16px; border-bottom: 1px solid var(--line); color: var(--ink-2);
    font-size: 13px; background: var(--bg);
  }
  .bar a {
    color: var(--ink); text-decoration: none; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line);
    transition: border-color .15s;
  }
  .bar a:hover { border-color: var(--ink-2); }
  .bar span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  iframe {
    flex: 1 1 auto; width: 100%; border: 0; display: block; background: var(--bg);
  }
</style>
</head>
<body>
  <div class="bar">
    <a href="../index.html">← 我的收藏夹</a>
    <span>免费 Tokens 白嫖攻略</span>
  </div>
  <iframe src="index.html" title="免费 Tokens 白嫖攻略"></iframe>
</body>
</html>
