<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人简历 · 我的收藏夹</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f6f7f9;
    --bg-elev: #ffffff;
    --bg-soft: #f0f2f5;
    --ink: #14161c;
    --ink-2: #4a5160;
    --ink-3: #8a91a0;
    --line: #e5e7ec;
    --line-strong: #d5d8e0;
    --accent: #2b4bf2;
    --accent-soft: #eef1fe;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(16, 20, 32, .04), 0 8px 24px rgba(16, 20, 32, .05);
  }
  html[data-theme="dark"] {
    --bg: #0d0f14;
    --bg-elev: #161922;
    --bg-soft: #1b1f29;
    --ink: #eef1f6;
    --ink-2: #b6bcc9;
    --ink-3: #7f8798;
    --line: #262b35;
    --line-strong: #333a47;
    --accent: #7c8cff;
    --accent-soft: #1c2140;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { width: min(1080px, calc(100% - 48px)); margin: 0 auto; }

  .topbar {
    position: sticky; top: 0; z-index: 20; height: 56px; display: flex; align-items: center;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: saturate(140%) blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .topbar .wrap { display: flex; align-items: center; gap: 12px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 13px;
    border-radius: 999px; border: 1px solid var(--line-strong); background: var(--bg-elev);
    font-size: 12.5px; color: var(--ink-2); cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .pill:hover { border-color: var(--ink-3); color: var(--ink); }
  .topbar .right { margin-left: auto; display: flex; gap: 8px; }

  .layout { display: grid; grid-template-columns: 302px minmax(0, 1fr); gap: 40px; padding: 40px 0 70px; }

  /* 左栏 */
  .side { position: sticky; top: 80px; align-self: start; }
  .id-card {
    background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 24px 22px; box-shadow: var(--shadow);
  }
  .avatar {
    width: 62px; height: 62px; border-radius: 18px; display: grid; place-items: center;
    font-size: 24px; font-weight: 800; color: #fff;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
  }
  .id-card h1 { margin: 16px 0 4px; font-size: 22px; font-weight: 760; letter-spacing: -.01em; }
  .id-card .headline { margin: 0; color: var(--ink-2); font-size: 13.5px; }
  .status {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 12px;
    height: 24px; padding: 0 10px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 11.5px; font-weight: 600;
  }
  .status::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 18%, transparent);
  }
  .facts { list-style: none; margin: 18px 0 0; padding: 16px 0 0; border-top: 1px solid var(--line); }
  .facts li { display: flex; gap: 10px; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
  .facts li:last-child { margin-bottom: 0; }
  .facts b { flex: 0 0 48px; color: var(--ink-3); font-weight: 500; font-size: 12.5px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .links a {
    height: 28px; padding: 0 11px; display: inline-flex; align-items: center;
    border-radius: 999px; background: var(--bg-soft); border: 1px solid var(--line);
    font-size: 12.5px; color: var(--ink-2); transition: color .15s, border-color .15s;
  }
  .links a:hover { color: var(--accent); border-color: var(--accent); }

  /* 右栏 */
  .about {
    margin: 0 0 34px; padding: 0 0 0 16px; border-left: 3px solid var(--accent);
    color: var(--ink-2); font-size: 14.5px;
  }
  .block { margin-bottom: 38px; }
  .block > h2 {
    margin: 0 0 16px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 600;
    display: flex; align-items: center; gap: 10px;
  }
  .block > h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tags span {
    height: 28px; padding: 0 11px; display: inline-flex; align-items: center;
    border-radius: 999px; background: var(--bg-elev); border: 1px solid var(--line);
    font-size: 12.5px; color: var(--ink-2);
  }

  .tl-item { position: relative; padding: 0 0 22px 22px; border-left: 1px solid var(--line); }
  .tl-item:last-child { padding-bottom: 0; border-left-color: transparent; }
  .tl-item::before {
    content: ""; position: absolute; left: -4.5px; top: 7px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent);
  }
  .tl-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; }
  .tl-head strong { font-size: 15.5px; font-weight: 700; }
  .tl-head .org { color: var(--ink-2); font-size: 13.5px; }
  .tl-head time { margin-left: auto; font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .tl-item ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; }
  .tl-item li { margin-bottom: 5px; }
  .tl-item li:last-child { margin-bottom: 0; }

  .proj { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .proj-card {
    display: flex; flex-direction: column; gap: 8px; padding: 18px;
    background: var(--bg-elev); border: 1px solid var(--line); border-radius: 14px;
    transition: transform .18s ease, border-color .18s ease;
  }
  .proj-card:hover { transform: translateY(-2px); border-color: var(--line-strong); }
  .proj-card h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .proj-card p { margin: 0; color: var(--ink-2); font-size: 13px; }
  .proj-card .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 8px; }
  .proj-card .meta span {
    font-size: 11px; color: var(--ink-3); background: var(--bg-soft);
    padding: 1px 8px; border-radius: 999px; height: 22px; display: inline-flex; align-items: center;
  }
  .proj-card .more { font-size: 12.5px; color: var(--accent); font-weight: 600; }

  .foot { padding: 0 0 54px; }
  .foot p { margin: 0; font-size: 12.5px; color: var(--ink-3); }
  .foot code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--bg-soft); padding: 1px 5px; border-radius: 5px;
  }
  .hint {
    margin: 0 0 22px; padding: 12px 16px; border-radius: 12px;
    background: var(--accent-soft); color: var(--ink-2); font-size: 13px;
  }
  .hint b { color: var(--ink); }

  @media (max-width: 880px) {
    .wrap { width: calc(100% - 32px); }
    .layout { grid-template-columns: 1fr; gap: 30px; padding: 26px 0 50px; }
    .side { position: static; }
  }
  @media print {
    .topbar, .hint { display: none; }
    body { background: #fff; color: #000; }
    .layout { grid-template-columns: 220px 1fr; padding: 0; }
    .id-card, .proj-card, .tags span { border-color: #ddd; box-shadow: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="pill" href="../index.html">← 返回首页</a>
    <div class="right">
      <button class="pill" id="themeBtn" type="button">深色</button>
      <button class="pill" id="printBtn" type="button">打印 / 存 PDF</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="layout">
    <aside class="side">
      <div class="id-card">
        <div class="avatar" id="avatar">C</div>
        <h1 id="name">—</h1>
        <p class="headline" id="headline"></p>
        <span class="status" id="status" hidden></span>
        <ul class="facts" id="facts"></ul>
        <div class="links" id="links"></div>
      </div>
    </aside>

    <section>
      <p class="hint" id="hint"></p>
      <p class="about" id="about"></p>
      <div id="blocks"></div>
    </section>
  </div>
</main>

<footer class="foot wrap">
  <p>数据来自 <code>resume/data.json</code> · 更新于 <span id="updated">—</span></p>
</footer>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  /* 主题 */
  var THEME_KEY = "resume-theme";
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    $("#themeBtn").textContent = t === "dark" ? "浅色" : "深色";
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }
  (function () {
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    if (!saved) saved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    applyTheme(saved);
  })();
  $("#themeBtn").addEventListener("click", function () {
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });
  $("#printBtn").addEventListener("click", function () { window.print(); });

  /* 渲染 */
  function render(d) {
    var p = d.profile || {}, meta = d.meta || {};
    document.title = (p.name || "个人简历") + " · 简历";
    $("#avatar").textContent = (p.name || "?").slice(0, 1);
    $("#name").textContent = p.name || "你的名字";
    $("#headline").textContent = p.headline || "";
    if (p.status) { $("#status").hidden = false; $("#status").textContent = p.status; }
    $("#about").textContent = d.about || "";
    $("#about").hidden = !d.about;
    $("#updated").textContent = meta.updated || "—";
    if (meta.note) {
      $("#hint").innerHTML = "<b>示例内容</b> · " + esc(meta.note);
    } else {
      $("#hint").hidden = true;
    }

    var facts = [];
    if (p.location) facts.push(["城市", p.location]);
    if (p.email) facts.push(["邮箱", p.email]);
    if (p.phone) facts.push(["电话", p.phone]);
    $("#facts").innerHTML = facts.map(function (f) {
      return "<li><b>" + esc(f[0]) + "</b><span>" + esc(f[1]) + "</span></li>";
    }).join("");

    $("#links").innerHTML = (p.links || []).map(function (l) {
      var ext = /^https?:/i.test(l.href || "") ? ' target="_blank" rel="noopener"' : "";
      return '<a href="' + esc(l.href || "#") + '"' + ext + ">" + esc(l.label) + "</a>";
    }).join("");

    $("#blocks").innerHTML = (d.blocks || []).map(function (b) {
      var body = "";
      if (b.type === "tags") {
        body = '<div class="tags">' + (b.items || []).map(function (t) {
          return "<span>" + esc(t) + "</span>";
        }).join("") + "</div>";
      } else if (b.type === "timeline") {
        body = (b.items || []).map(function (it) {
          var pts = (it.points || []).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("");
          return '<div class="tl-item">' +
              '<div class="tl-head"><strong>' + esc(it.title) + "</strong>" +
                (it.org ? '<span class="org">' + esc(it.org) + "</span>" : "") +
                (it.time ? "<time>" + esc(it.time) + "</time>" : "") +
              "</div>" +
              (pts ? "<ul>" + pts + "</ul>" : "") +
            "</div>";
        }).join("");
      } else if (b.type === "cards") {
        body = '<div class="proj">' + (b.items || []).map(function (it) {
          var tags = (it.tags || []).map(function (t) { return "<span>" + esc(t) + "</span>"; }).join("");
          var more = it.href ? '<a class="more" href="' + esc(it.href) + '">查看 →</a>' : "";
          return '<div class="proj-card">' +
              "<h3>" + esc(it.name) + "</h3>" +
              "<p>" + esc(it.desc || "") + "</p>" +
              '<div class="meta">' + tags + "</div>" + more +
            "</div>";
        }).join("") + "</div>";
      }
      return '<section class="block"><h2>' + esc(b.title) + "</h2>" + body + "</section>";
    }).join("");
  }

  fetch("data.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(render)
    .catch(function (e) {
      $("#hint").hidden = false;
      $("#hint").innerHTML = "<b>读不到 resume/data.json</b> · " + esc(e.message) +
        "。请用本地服务器打开（python -m http.server）而不是双击 html。";
    });
})();
</script>
</body>
</html>
